services:
  postgres:
    image: postgres:16-alpine
    container_name: syncspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncspace
      POSTGRES_PASSWORD: syncspace_dev_password
      POSTGRES_DB: syncspace_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncspace -d syncspace_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
